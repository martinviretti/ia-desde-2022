  <script>
    const tl = gsap.timeline({ paused: true });
    const E_IN = "expo.out", E_OUT = "power3.in";
    // El ciclo se arma donde cayeron las pestañas
    tl.fromTo("#a-draw", { strokeDashoffset: 1885 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.0);
    tl.fromTo(".a-st", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)", stagger: 0.08 }, 0.2);
    tl.fromTo(["#a-time", "#a-sub1"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.6);
    tl.fromTo("#a-goal", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power4.out" }, 0.4);
    tl.fromTo("#a-c0", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power4.out" }, 0.8);

    // Seis pasos: el portador gira hasta la estación y la tarjeta cambia en el mismo lugar
    const stations = [0, 1, 1, 2, 3, 1];
    const angles = [0, 90, 90, 180, 270, 450];
    let prevCard = "#a-c0";
    let prevSt = null;
    stations.forEach((st, k) => {
      const t = 4.0 + k * 2.6;
      if (k === 0) tl.to("#a-halo", { opacity: 1, duration: 0.25 }, t - 0.1);
      tl.to("#a-carrier", { rotation: angles[k], svgOrigin: "400 400", duration: 0.6, ease: "power2.inOut" }, t - 0.1);
      if (prevSt !== null && prevSt !== st) {
        tl.to("#a-s" + prevSt + " circle", { fill: "#16161a", duration: 0.2 }, t);
        tl.to("#a-s" + prevSt + " text", { fill: "#ededee", duration: 0.2 }, t);
      }
      tl.to("#a-s" + st + " circle", { fill: "#ff7a45", duration: 0.25 }, t + 0.35);
      tl.to("#a-s" + st + " text", { fill: "#120a06", duration: 0.25 }, t + 0.35);
      tl.to(prevCard, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: E_OUT }, t - 0.18);
      tl.fromTo("#a-c" + (k + 1), { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, t);
      prevCard = "#a-c" + (k + 1);
      prevSt = st;
    });

    // El reloj corre mientras trabaja: 00:00 → 04:12
    const clock = { s: 0 };
    const timeEl = document.querySelector("#a-time");
    tl.to(clock, { s: 252, duration: 15.6, ease: "none", onUpdate: () => {
      const s = Math.round(clock.s);
      timeEl.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    } }, 4.0);

    // Frena antes de lo irreversible
    tl.to(prevCard, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: E_OUT }, 19.42);
    tl.fromTo("#a-c7", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 19.6);
    tl.to("#a-sub1", { opacity: 0, duration: 0.15 }, 19.6);
    tl.to("#a-sub2", { opacity: 1, duration: 0.2 }, 19.7);
    tl.to("#a-s1 circle", { fill: "#16161a", duration: 0.2 }, 19.6);
    tl.to("#a-s1 text", { fill: "#ededee", duration: 0.2 }, 19.6);
    tl.to("#a-halo", { opacity: 0, duration: 0.2 }, 19.6);
    // El cursor confirma
    tl.fromTo("#a-cursor", { opacity: 0, x: 360, y: 220 }, { opacity: 1, x: 0, y: 0, duration: 0.7, ease: "power2.inOut" }, 19.9);
    tl.to("#a-ok", { scale: 0.95, duration: 0.08, ease: "power2.out" }, 20.65);
    tl.to("#a-ok", { scale: 1, duration: 0.2, ease: "power2.out" }, 20.73);
    tl.fromTo("#a-done", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 20.95);
    window.__timelines["agente"] = tl;
  </script>
